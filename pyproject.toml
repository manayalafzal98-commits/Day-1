[project]
name = "day1-starter"
version = "0.1.0"
description = "Glosix Agentic AI internship, Day 1: workstation check and first-PR starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
setup-check = "day1_starter.setup_check:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/day1_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
